<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Contact Us - Trav-Advisor</title>
    <link rel="stylesheet" href="./travel_recommendation.css">
</head>
<body>
    <nav class="navbar">
        <strong>Trav-Advisor</strong>
        <ul class="nav-links">
            <li><a href="./travel_recommendation.html">Home</a></li>
            <li><a href="./about_us.html"">About Us</a></li>
            <li><a href="./contact_us.html"">Contact Us</a></li>
        </ul>
        <div>
        </div>
    </nav>
    
    <div class="contact-section">
        <!-- Titre principal -->
        <h1 class="presentationHeader">Contactez-nous</h1>
        <p class="presentationText">Une question sur une destination ? Notre équipe est là pour vous répondre.</p>

        <div class="contact-container">
            
            <!-- À GAUCHE : Le Formulaire -->
            <form class="contact-form">
                <div class="form-group">
                    <label for="name">Nom complet</label>
                    <input type="text" id="name" placeholder="Votre nom" required>
                </div>

                <div class="form-group">
                    <label for="email">Adresse e-mail</label>
                    <input type="email" id="email" placeholder="nom@exemple.com" required>
                </div>

                <div class="form-group">
                    <label for="message">Votre message</label>
                    <textarea id="message" rows="5" placeholder="Comment pouvons-nous vous aider ?" required></textarea>
                </div>

                <button type="submit" class="btn-submit">Envoyer le message</button>
            </form>

            <!-- À DROITE : Les Infos de Contact -->
            <div class="contact-info" id="presentationText">
                <div class="info-box">
                    <h3>📍 Notre bureau</h3>
                    <p>123 Avenue des Voyageurs<br>75001 Paris, France</p>
                </div>

                <div class="info-box">
                    <h3>✉️ E-mail</h3>
                    <p>support@trav-advisor.com</p>
                </div>

                <div class="info-box">
                    <h3>📞 Téléphone</h3>
                    <p>+33 (0)1 23 45 67 89</p>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
